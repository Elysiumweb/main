name: CI

on:
  pull_request:
  push:
    branches: [main, arena/01a077b6-main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  SKIP_PREFLIGHT_CHECK: true
  GENERATE_SOURCEMAP: false
  REACT_APP_SITE_URL: https://elysium-esport.fr
  REACT_APP_FIREBASE_API_KEY: demo-api-key
  REACT_APP_FIREBASE_AUTH_DOMAIN: demo-elysium.firebaseapp.com
  REACT_APP_FIREBASE_PROJECT_ID: demo-elysium
  REACT_APP_FIREBASE_STORAGE_BUCKET: demo-elysium.appspot.com
  REACT_APP_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
  REACT_APP_FIREBASE_APP_ID: 1:000000000000:web:0000000000000000000000
  REACT_APP_FIREBASE_FUNCTIONS_REGION: us-central1
  BUNDLE_ENTRYPOINT_JS_GZIP_BUDGET_KB: "430"
  BUNDLE_ENTRYPOINT_CSS_GZIP_BUDGET_KB: "80"

jobs:
  quality:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Installation reproductible
        run: npm ci

      - name: Installation Functions reproductible
        run: npm ci --prefix functions

      - name: Validation configuration documentée
        run: npm run env:example && npm run env:check

      - name: Audit production analysable
        run: npm run audit:prod && npm run audit:functions

      - name: Lint
        run: npm run lint

      - name: Typecheck checkJs
        run: npm run typecheck

      - name: Tests unitaires
        run: npm run test:unit -- --runInBand

      - name: Tests règles Firestore Emulator
        run: npm run test:rules

      - name: Build, prérendu et budgets
        run: npm run build

      - name: Vérification sitemap, RSS, ICS et assets
        run: npm run verify:seo && npm run verify:assets && test -s public/matches.ics

      - name: Playwright Chromium mobile/desktop
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -- --project=chromium-desktop --project=mobile-chrome

      - name: Lighthouse budgets
        run: npx --yes @lhci/cli@0.14.0 autorun
