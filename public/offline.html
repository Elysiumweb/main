<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#111111" />
        <meta name="color-scheme" content="dark" />
        <meta name="robots" content="noindex,nofollow" />
        <title>Hors ligne — ELYSIUM Esport</title>
        <link rel="icon" type="image/png" href="/brand/logo-icon-gold.png" />
        <style>
            :root {
                color-scheme: dark;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                background: #111111;
                color: #f7f7f7;
                font-family: "Rajdhani", -apple-system, BlinkMacSystemFont, "Segoe UI",
                    Roboto, Helvetica, Arial, sans-serif;
                text-align: center;
            }
            .wrap {
                max-width: 640px;
            }
            img {
                width: 72px;
                height: auto;
                opacity: 0.9;
                margin-bottom: 28px;
            }
            .badge {
                color: #d8ca82;
                font-size: 11px;
                letter-spacing: 0.5em;
                text-transform: uppercase;
                margin: 0 0 16px;
            }
            h1 {
                font-size: clamp(28px, 7vw, 48px);
                text-transform: uppercase;
                font-weight: 900;
                margin: 0;
                letter-spacing: 0.02em;
            }
            p.desc {
                color: #c8c8c8;
                line-height: 1.6;
                margin: 24px auto 0;
                max-width: 34rem;
                font-size: 16px;
            }
            .actions {
                margin-top: 36px;
                display: flex;
                flex-wrap: wrap;
                gap: 16px;
                justify-content: center;
            }
            a,
            button {
                font: inherit;
                text-transform: uppercase;
                letter-spacing: 0.18em;
                font-size: 13px;
                padding: 14px 26px;
                border: 1px solid rgba(216, 202, 130, 0.5);
                color: #d8ca82;
                background: transparent;
                text-decoration: none;
                cursor: pointer;
                min-height: 44px;
                display: inline-flex;
                align-items: center;
                transition: background-color 0.2s ease;
            }
            a.primary,
            button.primary {
                background: #d8ca82;
                color: #111111;
                border-color: #d8ca82;
            }
            a:hover,
            button:hover {
                background: rgba(216, 202, 130, 0.12);
            }
            a.primary:hover,
            button.primary:hover {
                background: #e6dba4;
            }
            .status {
                margin-top: 20px;
                color: #d8ca82;
                font-size: 14px;
                min-height: 20px;
            }
            @media (prefers-reduced-motion: reduce) {
                * {
                    transition: none !important;
                }
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <img src="/brand/logo-icon-gold.png" alt="ELYSIUM Esport" />
            <p class="badge" data-i18n="badge">Hors connexion</p>
            <h1 data-i18n="title">Vous êtes hors ligne</h1>
            <p class="desc" data-i18n="desc">
                Cette page n'est pas disponible sans connexion internet. Vérifiez
                votre réseau puis réessayez — les pages déjà consultées restent
                accessibles.
            </p>
            <p class="status" id="status" role="status" aria-live="polite"></p>
            <div class="actions">
                <button class="primary" id="retry" type="button" data-i18n="retry">Réessayer</button>
                <a href="/" data-i18n="home">Retour à l'accueil</a>
            </div>
        </div>
        <script>
            (function () {
                var strings = {
                    fr: {
                        badge: "Hors connexion",
                        title: "Vous êtes hors ligne",
                        desc: "Cette page n'est pas disponible sans connexion internet. Vérifiez votre réseau puis réessayez — les pages déjà consultées restent accessibles.",
                        retry: "Réessayer",
                        home: "Retour à l'accueil",
                        back: "Connexion rétablie.",
                    },
                    en: {
                        badge: "Offline",
                        title: "You are offline",
                        desc: "This page is unavailable without an internet connection. Check your network and try again — pages you already visited remain accessible.",
                        retry: "Try again",
                        home: "Back to home",
                        back: "Connection restored.",
                    },
                };
                var lang = "fr";
                try {
                    lang = localStorage.getItem("elysium_lang") === "en" ? "en" : "fr";
                } catch (e) {
                    /* stockage indisponible */
                }
                var dict = strings[lang];
                document.documentElement.lang = lang;
                document.title =
                    (lang === "en" ? "Offline" : "Hors ligne") + " — ELYSIUM Esport";
                Array.prototype.forEach.call(
                    document.querySelectorAll("[data-i18n]"),
                    function (el) {
                        var key = el.getAttribute("data-i18n");
                        if (dict[key]) el.textContent = dict[key];
                    },
                );

                var status = document.getElementById("status");
                function reload() {
                    window.location.reload();
                }
                document.getElementById("retry").addEventListener("click", reload);
                window.addEventListener("online", function () {
                    status.textContent = dict.back;
                    setTimeout(reload, 800);
                });
            })();
        </script>
    </body>
</html>
